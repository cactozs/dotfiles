# Gruvbox dark theme for Alacritty
# Palette: https://github.com/morhetz/gruvbox

[colors.primary]
background = "#282828"
foreground = "#ebdbb2"

[colors.cursor]
text = "#282828"
cursor = "#ebdbb2"

[cursor.style]
shape = "Beam"        # "Beam", "Block", "Underline"
blinking = "Off"      # "Never", "Off", "On", "Always"

[colors.normal]
black = "#282828"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"

[colors.bright]
black = "#928374"
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
magenta = "#d3869b"
cyan = "#8ec07c"
white = "#ebdbb2"

[colors.dim]
black = "#282828"
red = "#982c2b"
green = "#6f6f1a"
yellow = "#a87f2f"
blue = "#4d7d85"
magenta = "#8f5686"
cyan = "#587d60"
white = "#7c6f64"

[[colors.indexed_colors]]
index = 16
color = "#1d2021"

[[colors.indexed_colors]]
index = 17
color = "#32302f"

[font]
normal.family = "JetBrains Mono"
bold.family = "JetBrains Mono"
italic.family = "JetBrains Mono"
size = 11.0

[window]
opacity = 1.0
padding.x = 12
padding.y = 8
