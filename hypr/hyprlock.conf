# ─────────────────────────────────────────────
# HYPRLOCK — Gruvbox dark
# ─────────────────────────────────────────────

general {
    hide_cursor = true
    disable_loading_bar = true
    immediate_render = true
}

# ── Wallpaper ─────────────────────────────────

background {
    monitor =
    path = ~/Pictures/Wallpapers/nix.jpg

    blur_passes = 3
    blur_size = 8

    brightness = 0.55
    contrast = 0.90
    vibrancy = 0.0
}

# ── Clock ──────────────────────────────────────

label {
    monitor =

    text = cmd[update:1000] echo "$(date '+%H:%M')"

    color = rgba(235, 219, 178, 0.95)
    font_size = 96
    font_family = JetBrainsMono Nerd Font

    position = 0, 180
    halign = center
    valign = center
}

# ── Date ───────────────────────────────────────

label {
    monitor =

    text = cmd[update:60000] echo "$(date '+%A, %d %B')"

    color = rgba(168, 153, 132, 0.75)
    font_size = 20
    font_family = JetBrainsMono Nerd Font

    position = 0, 65
    halign = center
    valign = center
}

# ── Password ──────────────────────────────────

input-field {
    monitor =

    size = 460, 72

    # No rounded corners
    rounding = 0
    outline_thickness = 2

    # Gruvbox glass
    inner_color = rgba(40, 40, 40, 0.70)
    outer_color = rgba(69, 133, 136, 0.75)

    # Password dots
    dots_size = 0.22
    dots_spacing = 0.28
    dots_center = true
    dots_rounding = 0

    font_color = rgba(235, 219, 178, 1.0)
    font_family = JetBrainsMono Nerd Font

    fade_on_empty = false
    hide_input = false

    placeholder_text = <span foreground="##a89984">Password</span>

    fail_color = rgba(251, 73, 52, 1.0)
    check_color = rgba(184, 187, 38, 1.0)

    position = 0, -60
    halign = center
    valign = center
}

# ── Username ──────────────────────────────────

label {
    monitor =

    text = $USER

    color = rgba(213, 196, 161, 0.70)
    font_size = 18
    font_family = JetBrainsMono Nerd Font

    position = 0, -125
    halign = center
    valign = center
}

# ── Failed authentication ─────────────────────

label {
    monitor =

    text = $FAIL

    color = rgba(251, 73, 52, 0.90)
    font_size = 16
    font_family = JetBrainsMono Nerd Font

    position = 0, -155
    halign = center
    valign = center
}
